[package]
name = "kqb-companion"
version = "0.1.0"
edition = "2021"
description = "Companion app for Keyboard Quantizer B"
license = "GPL-2.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
dirs = "6"
open = "5"
